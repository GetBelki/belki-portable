name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm sync:check:record

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_DB: belki_test
          POSTGRES_USER: belki
          POSTGRES_PASSWORD: belki-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U belki -d belki_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://belki:belki-test@127.0.0.1:5432/belki_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag belki-portable:ci .
      - run: docker compose -f compose.yaml -f compose.local.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.external.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.external.yaml -f compose.managed.yaml config --quiet
        env:
          APP_BASE_URL: https://belki.example.com
          OIDC_CLIENT_ID: ci-client
          OIDC_CLIENT_SECRET: ci-secret
          OIDC_COOKIE_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          OIDC_ISSUER_URL: https://identity.example.com
          OIDC_TRUST_SECRET: ci-trust-secret
