services:
  gateway:
    volumes:
      - ./deployment/Caddyfile.local:/etc/caddy/Caddyfile:ro

  migrate:
    environment: &local-app-environment
      DATABASE_URL: postgresql://belki:belki-development@postgres:5432/belki
      DATABASE_SSL_MODE: disable
      APP_BASE_URL: http://localhost:${BELKI_HTTP_PORT:-8080}
      APP_CRYPTO_KEY: local-development-crypto-key-change-me
      BOOTSTRAP_TOKEN: local-development-bootstrap-token-change-me
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: belki-evidence
      S3_ACCESS_KEY_ID: belki
      S3_SECRET_ACCESS_KEY: belki-development
      S3_FORCE_PATH_STYLE: "true"
      EMAIL_MODE: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM_ADDRESS: belki@localhost
      INFERENCE_MODE: disabled
      PAYMENT_MODE: disabled
      DEPLOYMENT_MODE: self_hosted
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    environment:
      <<: *local-app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    environment:
      <<: *local-app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_DB: belki
      POSTGRES_USER: belki
      POSTGRES_PASSWORD: belki-development
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belki -d belki"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: belki
      MINIO_ROOT_PASSWORD: belki-development
    volumes:
      - minio-data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 belki belki-development &&
        mc mb --ignore-existing local/belki-evidence
    networks:
      - private
    depends_on:
      minio:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.31.0
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data
    networks:
      - private

volumes:
  postgres-data:
  minio-data:
  mailpit-data:
